<div class="container-fluid p-0">
    <div class="row m-0">
      <div class="col-12 p-0">
          <div class="login-card login-dark">
              <div>
                  <div><a class="logo" href="/"><img class="img-fluid for-light" src="../assets/images/logo/logo.png" alt="looginpage "><img class="img-fluid for-dark" src="../assets/images/logo/logo_dark.png" alt="looginpage"></a></div>
                  <div class="login-main">
                      <form class="theme-form" [formGroup]="loginForm">
                          <h4>وارد حساب کاربری شوید</h4>
                          <p>ایمیل و رمز عبور خود را برای ورود وارد کنید</p>
                          <div class="form-group">
                              <label class="col-form-label">آدرس ایمیل</label>
                              <input class="form-control" type="email" require="" formControlName="Email" placeholder="Test@gmail.com">
                          </div>
                          <div class="form-group">
                              <label class="col-form-label">پسورد</label>
                              <div class="form-input position-relative">
                                  <input class="form-control" dir="ltr" formControlName="Password" type="password" name="login[password]" need="" placeholder="*********">
                              </div>
                          </div>
                          <div class="form-group mb-0">
                              <div class="text-end mt-3">
                                  <button class="btn btn-primary btn-block w-100" type="submit" (click)="SubmitLoginForm()">ورود به سیستم</button>
                              </div>
                          </div>
               
                          <p class="mt-4 mb-0 text-center">حساب ندارید؟ با ادمین تماس بگیرید</p >
                      </form>
                  </div>
              </div>
          </div>
      </div>
    </div>
