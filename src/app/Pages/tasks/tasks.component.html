<div class="page-body">
    <div class="container-fluid">
        <div class="page-title">
            <div class="row">
                <div class="col-6">
                    <h4>مدیریت معرفی </h4>
                </div>
                <div class="col-6">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a href="dashboard-01.html">
                                <svg class="stroke-icon">
                <use href="assets/svg/icon-sprite.svg#stroke-home"></use>
              </svg></a>
                        </li>
                        <li class="breadcrumb-item">معرفی </li>
                        <li class="breadcrumb-item active">پیش فرض</li>
                    </ol>
                </div>
            </div>
        </div>
    </div>
    <!-- Container-fluid starts-->
    <div class="container-fluid">
        <div class="col-xl-12">
            <div class="card height-equal">
                <div class="card-header">
                    <h4>ثبت معرفی جدید</h4>
                </div>
                <div class="card-body custom-input">
                    <form class="row g-3" [formGroup]="TaskForm">
                        <div class="col-xl-6 col-sm-6">
                            <div class="col-form-label pt-0">انتخاب شرکت:<span class="font-danger">*</span></div>
                            <p-select 
                            [options]="ActiveCompanies"
                            formControlName="CompanyId"
                            optionLabel="name"
                            optionValue="id"
                            placeholder="انتخاب کنید"
                            class="w-full md:w-full"
                            style="width: 100%"
                            >
                          </p-select>
                        </div>
            
                        <div class="col-xl-6 col-sm-6">
                            <div class="col-form-label pt-0">وضعیت:<span class="font-danger">*</span></div>
                     
                                <p-select
                                [options]="taskStatusOptions"
                                formControlName="Status"
                                optionLabel="name"
                                optionValue="id"
                                placeholder="انتخاب کنید"
                                style="width: 100%"
                              >
                              </p-select>
                        </div>
                        <div class="col-xl-12 col-sm-6">
                            <label class="form-label" for="fullname">توضیحات </label>
                            <input class="form-control" formControlName="Description" id="fullname" type="text" placeholder="توضیحات " aria-label="توضیحات " required>
                        </div>

                        <div class="col-12">
                            <button class="btn btn-primary" (click)="SubmitNewTask()" type="submit">ارسال</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-sm-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">لیست معرفی های امروز من</h4>
                </div>
                <div class="table-responsive signal-table">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th scope="col">ردیف</th>
                                <th scope="col">نام شرکت </th>
                                <th scope="col">وضعیت </th>

                                <th scope="col">عملیات</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th scope="row">1</th>
                                <td>متوسط</td>
                                <td>متوسط</td>
                                <td>
                                    <button class="btn btn-warning">ویرایش</button>
                                    <button class="btn btn-danger" style="margin-right: 2%;">حذف</button>
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Container-fluid Ends-->
